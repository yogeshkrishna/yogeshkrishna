"#b19bff" font-size="13" class="mono">BENGALURU, IN</text><g transform="translate(650 70)"><rect width="496" height="278" rx="14" fill="#101725" stroke="#35425d"/><path d="M0 44H496" stroke="#35425d"/><circle cx="23" cy="22" r="5" fill="#ed9bb4"/><circle cx="43" cy="22" r="5" fill="#ead49a"/><circle cx="63" cy="22" r="5" fill="#62e4b2"/><text x="475" y="27" fill="#9aaac1" font-size="12" text-anchor="end" class="mono">yogesh / workspace</text><text x="25" y="85" fill="#62e4e9" font-size="18" class="mono">$ whoami</text><text x="25" y="117" fill="#f1f5ff" font-size="16" class="mono">developer. student. always curious.</text><text x="25" y="159" fill="#62e4e9" font-size="18" class="mono">$ cat interests.txt</text><text x="25" y="191" fill="#f1f5ff" font-size="16" class="mono">automation / backend / web</text><text x="25" y="220" fill="#9aaac1" font-size="16" class="mono">exploring ML + security</text><text x="25" y="254" fill="#b19bff" font-size="18" class="mono">$ build the next thing</text><rect class="pulse" x="267" y="237" width="9" height="19" fill="#b19bff"/></g><path d="M1025 366H1102V389" fill="none" stroke="#b19bff" stroke-opacity=".6"/><circle cx="1102" cy="389" r="4" fill="#b19bff"/><circle class="pulse" cx="1170" cy="50" r="4" fill="#62e4e9"/></svg>